<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<div class="estrutura area-principal">
  <mat-toolbar class="topo">
    <div class="topo-esquerda">
      <a class="logo" routerLink="/inicio">
        <i class="fab fa-steam"></i>
        <span>FAMIFY</span>
      </a>
    </div>

    <nav class="nav-links">
      <a routerLink="/match" routerLinkActive="ativo">Encontrar Família</a>
      <span class="nav-item-estatico">Como Funciona</span>
      <span class="nav-item-estatico">Regras Steam</span>
      <span class="nav-item-estatico">Ajuda</span>
    </nav>

    <div class="topo-direita">
      <button
        *ngIf="!usuarioLogado"
        type="button"
        class="btn-steam"
        (click)="conectarSteam()"
      >
        <i class="fab fa-steam"></i> Conectar Steam
      </button>

      <ng-container *ngIf="usuarioLogado">
        <div class="usuario" title="Conta ativa">
          <span class="avatar" aria-hidden="true">{{ iniciaisUsuario }}</span>
          <div class="usuario-texto">
            <strong>{{ usuario }}</strong>
            <small>Online na Steam</small>
          </div>
        </div>

        <div class="divisor-vertical"></div>

        <button
          type="button"
          class="btn-sair"
          (click)="desconectar()"
          title="Desconectar conta"
        >
          Sair
        </button>
      </ng-container>
    </div>
  </mat-toolbar>

  <main id="conteudo" class="conteudo" tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="rodape">
    Famify — Matchmaking de Famílias Steam
  </footer>
</div>
