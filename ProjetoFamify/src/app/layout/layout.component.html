<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<div class="estrutura">
  <mat-toolbar class="topo" *ngIf="!esconderTopo">
    <a class="logo" routerLink="/inicio" aria-label="Famify — página inicial">
      <span class="logo-simbolo"><mat-icon>groups</mat-icon></span>
      <span>{{ nomeSistema }}</span>
    </a>

    <nav class="nav-links" aria-label="Navegação principal">
      <a mat-button routerLink="/match" routerLinkActive="ativo">Encontrar família</a>
      <a mat-button routerLink="/inicio" fragment="como-funciona">Como funciona</a>
      <a mat-button routerLink="/inicio" fragment="regras-steam">Regras Steam</a>
      <a
        *ngIf="usuarioAdministrador"
        mat-button
        routerLink="/admin"
        routerLinkActive="ativo"
      >Gerenciar (Demo)</a>
    </nav>

    <div class="topo-direita">
      <button
        *ngIf="!usuarioLogado"
        mat-flat-button
        class="btn-steam"
        type="button"
        (click)="conectarSteam()"
      >
        <mat-icon>sports_esports</mat-icon>
        <span>Conectar Steam</span>
      </button>

      <ng-container *ngIf="usuarioLogado">
        <div class="usuario" title="Conta ativa">
          <span class="avatar" aria-hidden="true">{{ iniciaisUsuario }}</span>
          <div class="usuario-texto">
            <strong>{{ usuario }}</strong>
            <small>Online na Steam</small>
          </div>
        </div>
        <button
          mat-button
          type="button"
          class="btn-sair"
          (click)="desconectar()"
          title="Desconectar conta"
        >
          Sair
        </button>
      </ng-container>
    </div>
  </mat-toolbar>

  <main id="conteudo" class="conteudo" tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="rodape">
    <a class="rodape-logo" routerLink="/inicio">
      <mat-icon>groups</mat-icon> famify
    </a>
    <span>Matchmaking de Famílias Steam</span>
  </footer>
</div>
